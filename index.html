<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Redesign de Visualizações</title>
    <link rel="stylesheet" href="index.css">

<body>

    <section>

        <h3>Original</h3>
        <img src="/img/doces_original.png" alt="Visualização original dos doces" width="800">

        <h3>Design A: Ranking geral dos doces</h3>

        <h3>Design B: Tile grid map</h3>

    <!-- Caso 2: Tallest Rollercoasters (mesma estrutura) -->
